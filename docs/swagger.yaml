openapi: 3.0.0
info:
  title: Poliouapp API
  version: 1.0.0
  description: API documentation for the Poliouapp backend
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request (e.g. missing fields, email already in use)

  /auth/login:
    post:
      summary: Authenticate a user and get a token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized (invalid email or password)

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'Luiz'
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-29T15:00:00Z'

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: 'Luiz'
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd!'

    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: 'User created successfully'
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd!'

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Login successful'
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/User'
