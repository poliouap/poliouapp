openapi: 3.0.0
info:
  title: Poliouapp API
  version: 1.0.0
  description: API documentation for the Poliouapp backend
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully. O Frontend deve redirecionar o usuário para a tela de login após receber este status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request (e.g., missing fields or password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Email already in use)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Este e-mail já está cadastrado em nossa base de dados.'

  /auth/login:
    post:
      summary: Authenticate a user and get a token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized (invalid email or password)

  /users/profile:
    get:
      summary: Get logged user profile
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
    put:
      summary: Update user profile (name, avatarUrl, themePreference)
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  /users/profile/avatar:
    post:
      summary: Upload user profile avatar
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: The avatar image file (max 5MB, .jpg, .png, .webp)
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request (Invalid file or missing)
        '401':
          description: Unauthorized
        '500':
          description: Internal server error (e.g., Supabase upload failure)


components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'Luiz'
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        avatarUrl:
          type: string
          nullable: true
          example: 'https://example.com/avatar.png'
        themePreference:
          type: string
          example: 'dark'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-29T15:00:00Z'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          example: 'Luiz'
        avatarUrl:
          type: string
          nullable: true
          example: 'https://example.com/avatar.png'
        themePreference:
          type: string
          enum: [light, dark, system]
          example: 'dark'

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: 'Luiz'
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        password:
          type: string
          format: password
          minLength: 8
          example: 'StrongP@ssw0rd!'

    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: 'User created successfully'
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'luiz@example.com'
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd!'

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Login successful'
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/User'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: 'Descrição clara do erro ocorrido'

